server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Let the Angular router handle deep links like /search or /settings
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Angular hashes JS/CSS/font filenames, so they can be cached forever
  location ~* \.(?:js|css|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
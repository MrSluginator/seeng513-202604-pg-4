<div class="box">
  <div class="mobile">
    <a class="link" routerLink="/map" routerLinkActive="active">
      <f-icon name="map" size="m" />
    </a>
    <a class="link" routerLink="/saved" routerLinkActive="active">
      <f-icon name="bookmark" size="m" />
    </a>
    <a
      class="link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <f-icon name="home" size="m" />
    </a>
    <a class="link" routerLink="/post" routerLinkActive="active">
      <f-icon name="event" size="m" />
    </a>
    @if (auth.isLoggedIn()) {
      <a class="link" routerLink="/settings" routerLinkActive="active">
        <f-icon name="settings" size="m" />
      </a>
    } @else {
      <a class="link" routerLink="/sign_in" routerLinkActive="active">
        <f-icon name="profile" size="m" />
      </a>
    }
  </div>

  <div class="desktop">
    <div class="holder">
      <a
        class="link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <f-logo size="m" />
      </a>
      <a class="link" routerLink="/map" routerLinkActive="active"> Heat Map </a>
      <a class="link" routerLink="/saved" routerLinkActive="active">
        Saved Events
      </a>
      <a class="link" routerLink="/post" routerLinkActive="active">
        Post Event
      </a>
    </div>

    <div class="holder">
      <f-search-bar
        [(query)]="query"
        [placeholder]="nav.placeholder()"
        [results]="nav.results()"
        (resultSelected)="nav.select($event)"
      />
      @if (auth.isLoggedIn()) {
        <f-button
          class="profile"
          [text]="auth.user()?.username ?? 'Profile'"
          icon="profile"
          (clicked)="onSettingsClick()"
        />
      } @else {
        <f-button text="Sign In" (click)="onSignInClick()" />
      }
    </div>
  </div>
</div>

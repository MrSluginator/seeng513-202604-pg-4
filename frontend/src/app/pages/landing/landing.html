<div class="landing">
  <header class="banner">
    <div class="info">
      <div class="slogan">Spark New Connections</div>
      <h3>
        Browse nearby happenings, save favourites, and plan your next outing.
      </h3>
    </div>
    <div class="categories">
      <f-all-categories [form]="categoryForm" />
    </div>
  </header>
  <div class="content">
    <div class="featured">
      <h1>Our Picks:</h1>
      <f-event-grid
        size="l"
        [events]="featured.hasValue() ? featured.value().items : []"
        [display]="{ type: 'carousel', controls: true }"
        /* [loading]="featured.isLoading()" */
      />
    </div>
    <f-divider />
    <div #feedSection class="feed">
      <div class="feed-header">
        <div class="tags">
          <small>Showing items with the following tags:</small>
          @for (tag of filterSvc.filters().tags; track tag.id) {
            <f-widget
              [text]="tag.name"
              icon="times"
              (click)="filterSvc.removeTag(tag)"
            />
          }
        </div>
        <div class="filters">
          <f-menu-button
            class="sort"
            [text]="`Sort: ${filterSvc.filters().sort}`"
            label="Sort events"
            [options]="sortOptions"
            (selected)="onSortSelected($event)"
          />
          <f-search-bar
            class="search"
            placeholder="Search events..."
            [search]="search"
            (resultSelected)="selectEvent($event)"
          >
            <ng-template
              fSearchResult
              [fSearchResult]="search"
              let-result
              let-group="group"
              let-active="active"
            >
              {{ result.label }}
            </ng-template>
          </f-search-bar>
          <f-filter-button />
        </div>
      </div>
      <f-event-grid
        size="m"
        [events]="feed.hasValue() ? feed.value().items : []"
        [display]="{ type: 'grid', hidden: true }"
        /* [loading]="feed.isLoading()" */
      />
    </div>
  </div>
  <f-footer />
</div>

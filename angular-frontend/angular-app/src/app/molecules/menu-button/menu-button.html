<f-button
  [text]="text()"
  [icon]="icon()"
  [iconPosition]="'right'"
  [disabled]="disabled()"
  [label]="label()"
  [pressed]="open()"
  (clicked)="toggle()"
  (keydown.arrowdown)="openMenu($event)"
/>

@if (open()) {
  <div
    class="menu"
    [class.menu-end]="align() === 'end'"
    role="menu"
    [attr.aria-label]="label() ?? text()"
    (keydown)="onMenuKeydown($event)"
  >
    @for (option of options(); track option.value) {
      <button
        #item
        type="button"
        role="menuitem"
        class="item"
        [disabled]="option.disabled"
        (click)="select(option)"
      >
        @if (option.icon) {
          <f-icon [name]="option.icon" />
        }
        <span>{{ option.label }}</span>
      </button>
    }
  </div>
}

stages:
  - lint
  - test
  - build

# ----------------------------------------------------
# Frontend Jobs (Angular / pnpm)
# ----------------------------------------------------
.frontend:
  image: node:22-alpine
  variables:
    NG_CLI_ANALYTICS: "false"
    PNPM_STORE: "$CI_PROJECT_DIR/.pnpm-store"
  cache:
    key:
      files:
        - angular-frontend/angular-app/pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - cd angular-frontend/angular-app
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile

frontend:lint:
  extends: .frontend
  stage: lint
  script:
    - pnpm run lint
    - pnpm run format:check

frontend:build:
  extends: .frontend
  stage: build
  script:
    - node src/scripts/set-env.mjs
    - pnpm run build
  artifacts:
    paths:
      - angular-frontend/angular-app/dist/angular-app/browser/
    expire_in: 1 week

# ----------------------------------------------------
# Backend Jobs (Python / FastAPI)
# ----------------------------------------------------
backend:lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install --no-cache-dir flake8 black isort
  script:
    - flake8 .
    - black --check .
    - isort --check-only .

backend:test:
  stage: test
  image: python:3.11-slim
  variables:
    DATABASE_URL: "sqlite:///:memory:"
  before_script:
    - cd backend
    - apt-get update && apt-get install -y --no-install-recommends libpq-dev gcc && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
  script:
    - pytest

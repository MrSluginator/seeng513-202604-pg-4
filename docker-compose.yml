services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flare_user
      POSTGRES_PASSWORD: flare_password
      POSTGRES_DB: flare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flare_user -d flare_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://flare_user:flare_password@db:5432/flare_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - path: ./frontend/.env
        required: false
    depends_on:
      - backend

volumes:
  pgdata:
